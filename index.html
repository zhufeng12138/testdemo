<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>testdemo · 静态网页</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1f2328;
        background: #f6f8fa;
      }
      main {
        max-width: 36rem;
        margin: 2rem;
        padding: 2.5rem;
        background: #fff;
        border: 1px solid #d0d7de;
        border-radius: 12px;
        box-shadow: 0 1px 3px rgba(31, 35, 40, 0.08);
      }
      h1 { margin: 0 0 0.75rem; font-size: 2rem; }
      p { margin: 0.5rem 0; line-height: 1.7; color: #57606a; }
      code { padding: 0.15em 0.4em; background: #f6f8fa; border-radius: 6px; font-size: 0.9em; }
      .badge {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.25rem 0.6rem;
        font-size: 0.8rem;
        color: #0969da;
        background: #ddf4ff;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">GitHub Pages</span>
      <h1>testdemo</h1>
      <p>这是一个最简静态网页。推送到 <code>main</code> 分支后，GitHub Actions 会自动把它部署到 GitHub Pages。</p>
      <p>修改 <code>index.html</code> 即可更新这个页面。</p>
    </main>
  </body>
</html>
